<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="/theme-init.js"></script>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071a2c">
  <link rel="icon" href="/assets/el-mezaen-logo.jpeg" type="image/jpeg">
  <title>تسجيل الدخول | مزين مصر</title>
</head>
<body class="login-page">
  <main class="login-shell"><aside class="login-brand"><img src="/assets/el-mezaen-mark-v2.webp" alt="مزين مصر" width="96" height="114"><span>EL MEZAEN • منذ 1995</span><h1 id="loginBrandTitle">كل تفاصيل يومك<br>في مكان واحد.</h1><p id="loginBrandIntro">مساحة فريق مزين مصر<br>حجوزاتك، مهامك وحضورك بأمان.</p></aside><div class="login-access">
    <a class="login-back" href="/" data-safe-back data-back-fallback="/"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span>العودة للموقع</span></a>
    <section class="login-card" aria-labelledby="unifiedLoginTitle">
      <span>مزين مصر</span><h1 id="unifiedLoginTitle">تسجيل الدخول</h1><p id="unifiedLoginIntro">ادخل بحسابك، وهنفتح لك مساحتك تلقائيًا.</p>
      <form id="loginForm" novalidate>
        <label><b id="loginIdentityLabel">الإيميل أو اسم المستخدم أو رقم الموبايل</b><input id="email" name="username" type="text" autocomplete="username" required maxlength="254" dir="ltr" placeholder="اكتب بيانات حسابك"></label>
        <label id="loginPasswordRow"><b>كلمة المرور</b><input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <label id="loginPhoneConsentRow" class="login-phone-consent" hidden><input id="loginPhoneConsent" type="checkbox"><span>أوافق على إرسال رمز تحقق لرقم موبايلي.</span></label>
        <button id="loginSubmit" class="login-button" type="submit">دخول آمن</button>
      </form>
      <form id="unifiedOtpForm" hidden><label><b>رمز التحقق</b><input id="unifiedOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required></label><button id="unifiedVerify" class="login-button" type="submit">تأكيد الدخول</button><div class="login-code-actions"><button id="unifiedChangePhone" type="button">تعديل الرقم</button><button id="unifiedRetry" type="button" disabled>إعادة إرسال الرمز بعد دقيقة</button></div></form>
      <div id="unifiedRecaptcha"></div><p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
      <small id="loginAudienceHint">العميل يدخل برمز تحقق للموبايل. فريق العمل يدخل بالإيميل أو اسم المستخدم وكلمة المرور.</small>
    </section>
  </div></main>
  <script src="/firebase-config.js"></script>
  <script type="module" src="/src/login.js"></script>
</body>
</html>
