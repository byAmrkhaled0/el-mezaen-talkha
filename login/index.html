<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="/theme-init.js"></script>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071a2c">
  <link rel="icon" href="/assets/el-mezaen-logo.jpeg" type="image/jpeg">
  <title>دخول إدارة مزين مصر</title>
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-back" href="/" data-safe-back data-back-fallback="/"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span>العودة للموقع</span></a>
    <form class="login-card" id="loginForm" novalidate>
      <img src="/assets/el-mezaen-mark-v2.webp" alt="رمز مزين مصر" width="130" height="154">
      <span>EL MEZAEN • TALKHA</span>
      <h1>لوحة إدارة مزين مصر</h1>
      <p>سجّل الدخول بحساب Firebase المصرح له.</p>
      <label><b>البريد الإلكتروني</b><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label>
      <label><b>كلمة المرور</b><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <p class="login-error" id="loginError" role="alert"></p>
      <button class="login-button" type="submit">دخول آمن</button>
      <small>لا يتم حفظ كلمة المرور داخل الموقع أو JavaScript.</small>
    </form>
  </main>
  <script src="/firebase-config.js"></script>
  <script type="module" src="/src/login.js"></script>
</body>
</html>
